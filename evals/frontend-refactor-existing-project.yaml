schema_version: 1
id: frontend-refactor-existing-project

scenario:
  prompt: >
    An existing project uses traditional CSS, JavaScript, and HTML. Development
    is becoming difficult and the UI quality is poor. The user is considering
    whether the frontend architecture should change.
  expected_task_type: refactor_or_migration
  expected_routes:
    - frontend

must:
  - restore_current_project_facts
  - respect_relevant_authority_scope
  - use_fresh_primary_sources_for_material_external_claims
  - fairly_compare_serious_alternatives
  - distinguish_evidence_from_inference
  - expose_sources_supporting_major_conclusions

must_not:
  - force_reuse_and_build_as_primary_route
  - fabricate_unmeasured_quantitative_claims
  - overreach_authority_scope
  - treat_discovery_or_implementation_case_as_proof_of_technology_superiority
  - present_materially_uncertain_conclusion_as_proven

pass_condition:
  - "All must conditions are satisfied."
  - "No must_not condition is violated."
